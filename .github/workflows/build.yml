name: build-aarch64

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Set up native packaging tools
        run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config rpm ruby ruby-dev zip unzip bzip2
          sudo gem install fpm --version 1.17.0 --no-document

      - name: Restore CEF archive
        id: cache-cef
        uses: actions/cache@v4
        with:
          path: cef.tar.bz2
          key: cef-135-linuxarm64-v1

      - name: Download CEF (linuxarm64 minimal)
        if: steps.cache-cef.outputs.cache-hit != 'true'
        run: |
          url='https://cef-builds.spotifycdn.com/cef_binary_135.0.17%2Bgcbc1c5b%2Bchromium-135.0.7049.52_linuxarm64_minimal.tar.bz2'
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o cef.tar.bz2 "$url"
          echo '3bcb0e3994b4f2db168c314468eb7cc2f3ea0d64  cef.tar.bz2' | sha1sum -c -

      - name: Build and smoke-test engine (native Fedora 45 ARM64)
        run: |
          mkdir -p engine
          docker run --rm -v "$GITHUB_WORKSPACE":/w -w /w/engine fedora:45 bash -euo pipefail -c '
            test "$(uname -m)" = aarch64
            dnf -y --disablerepo="*" \
              --repofrompath=f45,https://mirrors.huaweicloud.com/fedora/releases/45/Everything/aarch64/os/ \
              --setopt=f45.gpgcheck=1 \
              --setopt=f45.gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-45-aarch64 \
              --setopt=install_weak_deps=False install \
              gcc gcc-c++ cmake ninja-build git bzip2 pkgconf-pkg-config \
              zlib-ng-compat-devel dbus-devel freeglut-devel freetype-devel \
              fftw-devel glew-devel glfw-devel glm-devel lz4-devel mpv-devel \
              ffmpeg-free-devel pulseaudio-libs-devel SDL2-devel gmp-devel mpfr-devel \
              wayland-devel wayland-protocols-devel libxkbcommon-devel \
              libX11-devel libXcursor-devel libXi-devel libXinerama-devel \
              libXrandr-devel libXxf86vm-devel mesa-libGL-devel mesa-libEGL-devel \
              gtk3 nss alsa-lib libXScrnSaver libXtst
            git clone -q https://github.com/Almamu/linux-wallpaperengine.git lwe
            git -C lwe checkout -q a0ddce586e9ff12e9d31ca6b103f6036cc1b68fe
            git -C lwe submodule update --init --depth 1 --recursive
            cd lwe
            mkdir -p build/cef
            echo "3bcb0e3994b4f2db168c314468eb7cc2f3ea0d64  /w/cef.tar.bz2" | sha1sum -c -
            cp /w/cef.tar.bz2 "build/cef/cef_binary_135.0.17+gcbc1c5b+chromium-135.0.7049.52_linuxarm64_minimal.tar.bz2"
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/lib64/linux-wallpaperengine \
              -DSPIRV_CROSS_SKIP_INSTALL=ON \
              -DBUILD_TESTING=OFF -DKISSFFT_STATIC=ON \
              -DKISSFFT_TEST=OFF -DKISSFFT_TOOLS=OFF
            cmake --build build --parallel 4 --target linux-wallpaperengine qjs_exe qjsc
            DESTDIR=/w/engine/engine-install cmake --install build
            cd /w/engine/engine-install/usr/lib64/linux-wallpaperengine
            LD_LIBRARY_PATH="$PWD" ./linux-wallpaperengine --help
          '
          sudo chown -R "$(id -u):$(id -g)" engine

      - name: Strip and package engine
        run: |
          d=engine/engine-install/usr/lib64/linux-wallpaperengine
          find "$d" -type f | while read -r f; do
            if [[ $(head -c4 "$f" | od -An -tx1 | tr -d ' \n') == 7f454c46 ]]; then strip --strip-debug "$f"; fi
          done
          rm -rf "$d"/include "$d"/lib "$d"/share "$d"/bin "$d"/qjs "$d"/qjsc
          chmod 4755 "$d/chrome-sandbox"
          ( cd "$d" && zip -q -r -9 "$GITHUB_WORKSPACE/engine.zip" . )
          # rpm via fpm
          stage=engine/stage; mkdir -p "$stage/usr/lib64" "$stage/usr/bin"
          cp -a "$d" "$stage/usr/lib64/linux-wallpaperengine"
          printf '%s\n' \
            '#!/bin/bash' \
            'cd /usr/lib64/linux-wallpaperengine || exit 1' \
            'export LD_LIBRARY_PATH="/usr/lib64/linux-wallpaperengine${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec ./linux-wallpaperengine "$@"' > "$stage/usr/bin/linux-wallpaperengine"
          chmod 755 "$stage/usr/bin/linux-wallpaperengine"
          deps=(glibc libstdc++ libgcc mesa-libGL mesa-libEGL mesa-libgbm libX11 libXrandr libXi libXcursor libXinerama libXScrnSaver libXtst libwayland-client libwayland-cursor libxkbcommon sdl2-compat mpv-libs ffmpeg-free glew libcurl pulseaudio-libs alsa-lib gtk3 nss libdrm libnotify at-spi2-core xdg-utils)
          dep_args=(); for x in "${deps[@]}"; do dep_args+=(--depends "$x"); done
          fpm -s dir -t rpm -n linux-wallpaperengine -v 0.20260609 \
            --iteration 1.gita0ddce5 --rpm-dist fc45 --architecture aarch64 \
            --license GPL-3.0-only --url https://github.com/Almamu/linux-wallpaperengine \
            --description 'Wallpaper Engine runtime for Linux (aarch64 build)' \
            "${dep_args[@]}" -C "$stage" \
            -p engine-linux-wallpaperengine-0.20260609-1.gita0ddce5.fc45.aarch64.rpm usr

      - uses: dtolnay/rust-toolchain@stable

      - name: Build steamworks addon (aarch64)
        run: |
          tar -xzf addon/src.tar.gz -C addon
          tar -xzf addon/steam-sdk-linuxarm64.tar.gz -C addon
          mkdir -p addon/steam-sdk && mv addon/redistributable_bin addon/steam-sdk/
          cd addon
          export STEAM_SDK_LOCATION="$PWD/steam-sdk"
          cargo build --locked --release
          cp target/release/libsteamworksjs.so ../addon-out.so

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Build UI (electron-builder)
        env:
          USE_SYSTEM_FPM: 'true'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          url='https://github.com/jagrat7/linux-wallpaper-engine/archive/refs/tags/v0.4.15.tar.gz'
          curl -fsSL "$url" -o gui.tar.gz
          tar -xzf gui.tar.gz
          cd linux-wallpaper-engine-0.4.15
          tar -xzf ../gui/arm64-extra.tar.gz
          bun install --frozen-lockfile
          node scripts/app.mjs build
          mkdir -p node_modules/steamworks.js/dist/linux64
          cp ../addon-out.so node_modules/steamworks.js/dist/linux64/steamworksjs.linux-arm64-gnu.node
          tar -xzf ../addon/steam-sdk-linuxarm64.tar.gz -C /tmp
          cp /tmp/redistributable_bin/linuxarm64/libsteam_api.so node_modules/steamworks.js/dist/linux64/libsteam_api.so
          tar -xzf ../gui/steamworks-js-overlay.tar.gz -C node_modules/steamworks.js
          # electron dist (official arm64 zip)
          curl -fsSL https://github.com/electron/electron/releases/download/v39.7.0/electron-v39.7.0-linux-arm64.zip -o /tmp/electron.zip
          echo '0154dfe256dbef46abd34257be10cab37cb4b117a144dbbf73d22159fa28abfb  /tmp/electron.zip' | sha256sum -c -
          # electron-builder can take the official arm64 zip directly
          ./node_modules/.bin/electron-builder --linux --arm64 \
            -c electron-builder.arm64.yml -c.electronDist=/tmp/electron.zip --publish never

      - name: Verify ARM64 packages and addon
        run: |
          gui=linux-wallpaper-engine-0.4.15/release-arm64/linux-arm64-unpacked
          addon="$gui/resources/app.asar.unpacked/node_modules/steamworks.js/dist/linux64/steamworksjs.linux-arm64-gnu.node"
          readelf -h "$gui/linux-wallpaper-engine" | grep 'Machine:.*AArch64'
          readelf -h "$addon" | grep 'Machine:.*AArch64'
          node -e 'const a = require(process.argv[1]); console.log("Native ARM64 addon:", Object.keys(a)); if (typeof a.init !== "function" || typeof a.workshop.getAllItems !== "function") process.exit(1)' "$PWD/$addon"
          for rpm in engine-linux-wallpaperengine-*.rpm linux-wallpaper-engine-0.4.15/release-arm64/*.rpm; do
            test "$(rpm -qp --qf '%{ARCH}' "$rpm")" = aarch64
            rpm -qpi "$rpm"
          done

      - name: Collect artifacts
        run: |
          mkdir -p dist
          mv engine-linux-wallpaperengine-0.20260609-1.gita0ddce5.fc45.aarch64.rpm dist/linux-wallpaperengine-0.20260609-1.gita0ddce5.fc45.aarch64.rpm
          cp engine.zip dist/linux-wallpaperengine-0.20260609-aarch64.zip
          cp linux-wallpaper-engine-0.4.15/release-arm64/linux-wallpaper-engine-0.4.15-aarch64.rpm dist/
          cp linux-wallpaper-engine-0.4.15/release-arm64/linux-wallpaper-engine-0.4.15-arm64.zip dist/
          cd dist && sha256sum * > SHA256SUMS
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-release
          path: dist/*
